<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brevio — AI Intake Assistant</title>
    <meta
      name="description"
      content="Brevio — conversational AI intake for service professionals. Powered by Claude, billed with Stripe."
    />

    <!-- SVG scales cleanly to every favicon size and stays a few hundred bytes.
         theme-color tints the browser chrome on mobile. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#1b1b18" />

    <!-- Link previews, for when a pro shares their intake URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Brevio — AI Intake Assistant" />
    <meta
      property="og:description"
      content="Let an AI assistant collect what you need from clients before the appointment — through a natural conversation, not a form."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=Fragment+Mono&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
